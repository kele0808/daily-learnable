name: Weekly digest

# Timed runs are off: Cursor Automation reviews repos before writing.
# Use "Run workflow" only if you want a no-review fallback.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push digest files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests README.md
          if git diff --cached --quiet; then
            echo "no digest changes"
            exit 0
          fi
          git commit -m "周报 $(TZ=Asia/Shanghai date +%F)"
          git push
